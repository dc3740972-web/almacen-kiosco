<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almacén y kiosco</title>
<style>
:root{--bg:#EEF1EC;--sf:#fff;--ink:#1B2A22;--mut:#66756C;--pri:#1F5F46;--onpri:#fff;--warn:#9A5200;--warnbg:#FFF0D9;--bad:#B3261E;--badbg:#FDE4E1;--ok:#1F5F46;--okbg:#E2F1E8;--line:#D9E0DA}
@media (prefers-color-scheme:dark){:root{--bg:#0F1713;--sf:#17211B;--ink:#E7EEE9;--mut:#93A39A;--pri:#5CC79B;--onpri:#0B1F15;--warn:#F0A94B;--warnbg:#3A2A10;--bad:#FF8A80;--badbg:#3D1A18;--ok:#5CC79B;--okbg:#17301F;--line:#263229}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding-bottom:92px}
header{position:sticky;top:0;z-index:9;background:var(--sf);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:18px;margin:0}h2{font-size:15px;color:var(--mut);margin:20px 0 8px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;margin-bottom:8px}
header select{width:auto;max-width:38%;margin:0}header h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
main{max-width:560px;margin:0 auto;padding:16px}
@media (min-width:900px){main{max-width:880px}}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.card,.prod{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.prod{width:100%;text-align:left;display:block}.prod:disabled{opacity:.55}
.top,.fld{display:flex;justify-content:space-between;gap:8px;align-items:center}.top{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:13px;padding:2px 9px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.chip.low{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.btn{width:100%;margin-top:8px;background:var(--pri);color:var(--onpri);font-weight:700;border-radius:12px;padding:14px}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:20px}
.note{color:var(--mut);font-size:14px}.gan{color:var(--ok);font-size:20px}
.alert{border-left:5px solid var(--warn)}.alert.bad{border-left-color:var(--bad)}
#cam{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}#cam video{flex:1;width:100%;min-height:0;object-fit:cover}.camb{padding:16px;background:var(--sf);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}.camb span{display:block;text-align:center;margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 2px;font-size:12px;font-weight:600;color:var(--mut)}nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
#toast{position:fixed;left:16px;right:16px;bottom:84px;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:none;z-index:30}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const sb=supabase.createClient("https://dckuvpbarqcopxsckscs.supabase.co","sb_publishable_mHWZIlxxvZAhour9Sio7cA_kcLllZXz");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("es-AR");
const today=new Date();today.setHours(0,0,0,0);
const days=s=>Math.round((new Date(s+"T00:00:00")-today)/864e5);
const when=d=>d==0?"hoy":d==1?"mañana":"en "+d+" días";
const S={tab:"v",q:"",cart:{},sub:{},pesar:null,imp:null,clisel:null,cli:[],prods:[],stock:[],locs:[],cfg:null};
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}
let ac=null;
function beep(ok){
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();
  o.type="square";o.frequency.value=ok?1100:300;g.gain.value=.15;
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(ok?.12:.3));
 }catch(e){}
}
const lotsOf=pid=>S.stock.filter(s=>s.lotes&&s.lotes.producto_id==pid).sort((a,b)=>(a.lotes.fecha_vencimiento||"9")>(b.lotes.fecha_vencimiento||"9")?1:-1);
const vend=s=>!s.lotes.fecha_vencimiento||days(s.lotes.fecha_vencimiento)>=0;
const avail=pid=>lotsOf(pid).filter(vend).reduce((a,s)=>a+s.cantidad,0);
const total=pid=>lotsOf(pid).reduce((a,s)=>a+s.cantidad,0);
const minOf=p=>p.stock_minimo??(S.cfg?S.cfg.stock_minimo_general:5);

function renderLogin(msg){
 $("app").innerHTML=`<main><h1>Almacén y kiosco</h1><h2>Entrar</h2><div class="card"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="btn" data-login="1">Entrar</button><p class="note">${esc(msg||"")}</p></div></main>`;
}
async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return renderLogin();
 S.user=session.user;
 const {data:p}=await sb.from("perfiles").select("*").eq("id",S.user.id).maybeSingle();
 if(!p){await sb.auth.signOut();return renderLogin("Tu usuario todavía no tiene perfil. Pedile al propietario que lo cargue.")}
 S.perfil=p;
 S.rol=p.rol=="vendedor"?"cajero":p.rol=="encargado"?"admin":p.rol;
 S.tab=S.rol=="repositor"?"i":"v";
 const {data:nz}=await sb.from("negocios").select("*").maybeSingle();S.negocio=nz;
 const {data:l}=await sb.from("ubicaciones").select("*").eq("activa",true).order("nombre");
 S.locs=l||[];
 S.loc=p.ubicacion_id||(S.locs.find(x=>x.tipo=="kiosco")||S.locs[0]||{}).id;
 await loadData();render();
}
async function loadData(){
 const [a,b,c,d,e,f,g]=await Promise.all([
  sb.from("productos").select("*").eq("activo",true).order("nombre"),
  sb.from("stock").select("cantidad,lote_id,lotes(id,codigo_lote,fecha_vencimiento,producto_id)").eq("ubicacion_id",S.loc).gt("cantidad",0),
  sb.from("configuracion_alertas").select("*").maybeSingle(),
  sb.from("v_stock_bajo").select("producto").eq("ubicacion_id",S.loc),
  sb.from("v_por_vencer").select("producto").eq("ubicacion_id",S.loc),
  sb.from("cajas").select("*").eq("ubicacion_id",S.loc).eq("estado","abierta").maybeSingle(),
  sb.from("v_saldos_clientes").select("*").eq("activo",true).order("nombre")]);
 S.prods=a.data||[];S.stock=b.data||[];S.cfg=c.data;S.na=(S.rol=="repositor"?0:(d.data||[]).length)+(e.data||[]).length;S.caja=f.data||null;S.cli=g.data||[];
}

function listHTML(){
 const q=S.q.trim().toLowerCase(),ids=Object.keys(S.cart);
 let h=pesarHTML();
 if(ids.length){
  const t=ids.reduce((a,id)=>a+(S.sub[id]!=null?S.sub[id]:S.cart[id]*S.prods.find(p=>p.id==id).precio_venta),0);
  h+='<div class="card">'+ids.map(id=>{const p=S.prods.find(x=>x.id==id);
   if(esKg(p))return `<div class="fld"><span>${esc(p.nombre)}<br><small class="note">${S.cart[id]>=1?fq(S.cart[id])+" kg":fq(S.cart[id]*1000)+" g"} · ${money(S.sub[id])}</small></span><button style="color:var(--bad);font-weight:600;padding:6px" data-wdel="${id}">Quitar</button></div>`;
   return `<div class="fld"><span>${esc(p.nombre)}<br><small class="note">${money(p.precio_venta)} c/u</small></span><span class="qty"><button data-dec="${id}" aria-label="Quitar uno">−</button><b>${S.cart[id]}</b><button data-add="${id}" aria-label="Agregar uno">+</button></span></div>`}).join("")+
   `<select id="mp" aria-label="Medio de pago">${[["efectivo","Efectivo"],["tarjeta","Tarjeta"],["transferencia","Transferencia"],["fiado","Fiado (cuenta corriente)"]].map(m=>`<option value="${m[0]}"${S.pago==m[0]?" selected":""}>${m[1]}</option>`).join("")}</select>${S.pago=="fiado"?clienteSelHTML():""}<button class="btn" data-pay="1">Cobrar ${money(t)}</button></div>`;
 }
 h+=S.prods.filter(p=>!q||p.nombre.toLowerCase().includes(q)||(p.codigo_barras||"").includes(q)).map(p=>{
  const t=total(p.id),av=avail(p.id),first=lotsOf(p.id).filter(vend).find(s=>s.lotes.fecha_vencimiento);
  const vencidos=lotsOf(p.id).some(s=>!vend(s));
  let c=`<span class="chip ${t==0?"bad":t<=minOf(p)?"low":""}">Stock ${fq(t)}${esKg(p)?" kg":""}</span>`;
  if(first){const d=days(first.lotes.fecha_vencimiento);c+=`<span class="chip ${d<=(p.dias_alerta_vencimiento??S.cfg?.dias_alerta_vencimiento??30)?"low":""}">Próximo lote vence ${when(d)}</span>`}
  if(vencidos)c+='<span class="chip bad">Hay lotes vencidos</span>';
  return `<button class="prod" data-add="${p.id}"${av?"":" disabled"}><div class="top"><span>${esc(p.nombre)}</span><span>${money(p.precio_venta)}${esKg(p)?" /kg":""}</span></div><div class="meta">${c}</div></button>`;
 }).join("")||'<p class="note">No hay productos. Cargalos en la pestaña Stock.</p>';
 return h;
}
function viewV(){return `${S.caja?"":'<div class="card alert"><b>La caja está cerrada</b><br><small class="note">Abrila en la pestaña Ventas para poder cobrar.</small></div>'}<button class="btn" data-cam="v" style="margin:0 0 8px">Escanear con la cámara</button><input id="q" type="search" placeholder="Escanear con lápiz o buscar producto" value="${esc(S.q)}" autocomplete="off"><div id="vl">${listHTML()}</div><p class="note">Lápiz óptico: conectalo por USB o Bluetooth y escaneá. Cada venta descuenta primero el lote que vence antes.</p>`}

async function viewS(){
 const {data}=S.caja?await sb.from("ventas").select("total,costo_total,creada_en").eq("caja_id",S.caja.id).order("creada_en",{ascending:false}):{data:[]};
 const m=data||[],v=m.reduce((a,s)=>a+Number(s.total),0),i=m.reduce((a,s)=>a+Number(s.costo_total),0);
 return resHTML()+`<h2>Ventas de la caja actual</h2><div class="card"><div class="fld"><span>Vendido</span><b>${money(v)}</b></div><div class="fld"><span>Invertido (costo de lo vendido)</span><b>${money(i)}</b></div><div class="fld"><span>Ganancia</span><b class="gan">${money(v-i)}</b></div><p class="note">${m.length} ventas. Ganancia = vendido − invertido.</p></div>`+
  cajaHTML()+"<h2>Ventas de esta caja</h2>"+
  (m.map(s=>`<div class="card"><div class="top"><span>${new Date(s.creada_en).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}</span><span>${money(s.total)}</span></div><small class="note">Ganancia ${money(s.total-s.costo_total)}</small></div>`).join("")||'<p class="card">Todavía no hay ventas en esta caja.</p>')+(S.rol=="admin"?mesHTML(await fetchMes(false)):"");
}

async function viewI(){
 const opts=S.prods.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join("");
 return `<h2>Ingresar mercadería</h2><div class="card"><button class="btn" data-cam="i" style="margin:0 0 8px">Escanear producto con la cámara</button><select id="ip">${opts}</select><input id="iq" type="number" min="0" step="any" inputmode="decimal" placeholder="Cantidad (en kilos si es por peso)"><input id="ic" type="number" min="0" placeholder="Costo por unidad"><input id="ie" type="date" aria-label="Vencimiento"><input id="il" placeholder="Código de lote (opcional)"><button class="btn" data-ing="1">Cargar al stock</button><p class="note">Se carga en la ubicación elegida arriba. El vencimiento se deja vacío si el producto no vence.</p></div>`+
  `${impHTML()}<h2>Importar lista del ticket</h2><div class="card"><textarea id="tx" rows="5" placeholder="Leche entera;24;1000;2026-12-30"></textarea><button class="btn" data-imp="1">Importar al stock</button><p class="note">Una línea por producto: nombre;cantidad;costo;vencimiento. El vencimiento es opcional (AAAA-MM-DD).</p></div><h2>Nuevo producto</h2><div class="card"><input id="np" placeholder="Nombre"><input id="nb" placeholder="Código de barras"><button class="btn" data-lookup="1" style="margin:0 0 8px;background:var(--okbg);color:var(--ok)">Buscar nombre por código</button><input id="npr" type="number" min="0" step="any" placeholder="Precio de venta (por kilo si es por peso)"><input id="nco" type="number" min="0" step="any" placeholder="Costo (por kilo si es por peso)"><select id="nm">${mgOpts(defModo())}</select><input id="nmo" type="number" step="any" placeholder="Porcentaje de ganancia" value="${defModo()=="otro"?(S.negocio&&S.negocio.margen_defecto):""}" style="${defModo()=="otro"?"":"display:none"}"><select id="nu"><option value="unidad">Se vende por unidad</option><option value="kg">Se vende por peso (kilo)</option></select><button class="btn" data-newp="1">Crear producto</button></div>`+
  `<h2>Stock actual</h2>`+(S.prods.map(p=>`<div class="card fld"><span>${esc(p.nombre)}</span><span><b>${fq(total(p.id))}${esKg(p)?" kg":""}</b>${total(p.id)==0?` <button style="color:var(--bad);font-weight:600;padding:6px" data-pdes="${p.id}">Dar de baja</button>`:""}</span></div>`).join("")||'<p class="note">Todavía no hay productos.</p>')+await inactivosHTML();
}

async function viewA(){
 const [b,x]=await Promise.all([sb.from("v_stock_bajo").select("*").eq("ubicacion_id",S.loc),sb.from("v_por_vencer").select("*").eq("ubicacion_id",S.loc)]);
 const out=[];
 (x.data||[]).forEach(r=>out.push(r.dias_restantes<0?`<div class="card alert bad"><b>Vencido: ${esc(r.producto)}</b><br><small class="note">${r.cantidad} unidades (lote ${esc(r.codigo_lote||"-")})</small>${S.rol=="cajero"?"":`<br><button style="color:var(--bad);font-weight:600;padding:6px 0" data-baja="${r.lote_id}" data-q="${r.cantidad}">Dar de baja</button>`}</div>`:`<div class="card alert"><b>Por vencer: ${esc(r.producto)}</b><br><small class="note">${r.cantidad} unidades vencen ${when(r.dias_restantes)}</small></div>`));
 (S.rol=="repositor"?[]:(b.data||[])).forEach(r=>out.push(`<div class="card alert"><b>Stock bajo: ${esc(r.producto)}</b><br><small class="note">Quedan ${r.cantidad} · límite ${r.limite}</small></div>`));
 return out.join("")||'<p class="card">Sin avisos. Todo en orden.</p>';
}

function prodLimits(d){
 return '<h2>Límites por producto</h2><p class="note">Vacío = usa el límite general.</p>'+S.prods.map(p=>`<div class="card"><b>${esc(p.nombre)}</b><div class="fld"><label class="note">Stock mínimo<input data-pl="${p.id}" data-f="stock_minimo" type="number" min="0" value="${p.stock_minimo??""}" placeholder="${S.cfg?.stock_minimo_general??5}"${d}></label><label class="note">Días antes de vencer<input data-pl="${p.id}" data-f="dias_alerta_vencimiento" type="number" min="0" value="${p.dias_alerta_vencimiento??""}" placeholder="${S.cfg?.dias_alerta_vencimiento??30}"${d}></label></div><div class="fld"><label class="note">Se vende por<select data-pl="${p.id}" data-f="unidad"${d}><option value="unidad"${p.unidad=="kg"?"":" selected"}>Unidad</option><option value="kg"${p.unidad=="kg"?" selected":""}>Kilo</option></select></label><label class="note">Código de balanza<input data-pl="${p.id}" data-f="plu" value="${esc(p.plu||"")}" inputmode="numeric"${d}></label></div></div>`).join("")||"";
}
async function viewC(){
 const c=S.cfg||{},d=S.rol=="admin"?"":" disabled";
 return `<h2>Límites de los avisos</h2><div class="card"><label>Avisar stock bajo desde (unidades)<input id="gm" type="number" min="0" value="${c.stock_minimo_general??5}"${d}></label><label>Avisar vencimientos con (días)<input id="gd" type="number" min="0" value="${c.dias_alerta_vencimiento??30}"${d}></label>${d?'<p class="note">Solo el propietario puede cambiarlos.</p>':'<button class="btn" data-save="1">Guardar límites</button>'}</div>${await usuariosHTML(d)}${negocioHTML(d)}${preciosHTML(d)}${balanzaHTML(d)}${prodLimits(d)}<button class="btn" data-out="1">Cerrar sesión</button>`;
}

async function render(){
 const keys=TABS[S.rol]||TABS.cajero;if(!keys.includes(S.tab))S.tab=keys[0];
 const v={v:viewV,s:viewS,k:viewK,i:viewI,a:viewA,c:viewC}[S.tab];
 const h=await v(),T={v:"Vender",k:"Clientes",s:S.rol=="cajero"?"Caja":"Ventas",i:"Stock",a:S.rol=="repositor"?"Vencimientos":"Avisos",c:"Ajustes"};
 $("app").innerHTML=`<header><h1>${esc(S.negocio&&S.negocio.nombre||"Almacén y kiosco")}</h1><select id="loc" aria-label="Ubicación">${S.locs.map(l=>`<option value="${l.id}"${l.id==S.loc?" selected":""}>${esc(l.nombre)}</option>`).join("")}</select><button data-out="1" style="color:var(--pri);font-weight:600;padding:8px">Salir</button></header><main>${h}</main><nav>${keys.map(k=>`<button data-tab="${k}" class="${S.tab==k?"on":""}">${T[k]}${k=="a"&&S.na?" ("+S.na+")":""}</button>`).join("")}</nav>`;
}

function add(id){
 const p=S.prods.find(x=>x.id==id);
 if(esKg(p)){S.pesar=id;return}
 if((S.cart[id]||0)>=avail(id)){toast("No hay más stock vendible de "+p.nombre);return}
 S.cart[id]=(S.cart[id]||0)+1;
}
function scan(code){
 code=code.trim();
 if(ventaBalanza(code)){S.q="";S.tab="v";render();return}
 const p=S.prods.find(x=>x.codigo_barras==code);
 if(!p){beep(false);toast("No existe un producto con el código "+code);return}
 beep(true);add(p.id);S.q="";S.tab="v";render();
}
async function pay(){
 if(!S.caja)return toast("Abrí la caja para vender");
 if(S.pago=="fiado"){
  const cl=S.cli.find(c=>c.cliente_id==S.clisel);
  if(!cl)return toast("Elegí el cliente del fiado. Si no está, cargalo en la pestaña Clientes.");
  if(cl.limite_credito!=null&&Number(cl.saldo)+cartTotal()>Number(cl.limite_credito)&&!confirm("Supera el límite de crédito de "+cl.nombre+". ¿Cobrar igual?"))return;
 }
 const items=Object.entries(S.cart);if(!items.length)return;
 const {data:v,error:e1}=await sb.from("ventas").insert({ubicacion_id:S.loc,usuario_id:S.user.id,caja_id:S.caja.id,medio_pago:S.pago||"efectivo",cliente_id:S.pago=="fiado"?S.clisel:null}).select("id").single();
 if(e1)return toast(e1.message);
 const rows=[];
 for(const [pid,q] of items){
  let rem=q;const p=S.prods.find(x=>x.id==pid);
  for(const s of lotsOf(pid).filter(vend)){
   const t=Math.min(s.cantidad,rem);
   if(t>0){rows.push({venta_id:v.id,producto_id:pid,lote_id:s.lote_id,cantidad:t,precio_unitario:p.precio_venta});rem=Math.round((rem-t)*1000)/1000}
   if(rem<=0)break;
  }
 }
 for(const [pid,q] of items){
  if(S.sub[pid]==null)continue;
  const rs=rows.filter(r=>r.producto_id==pid);let acc=0;
  rs.forEach((r,i)=>{r.subtotal=i<rs.length-1?Math.round(S.sub[pid]*r.cantidad/q*100)/100:Math.round((S.sub[pid]-acc)*100)/100;acc+=r.subtotal});
 }
 const {error:e2}=await sb.from("venta_items").insert(rows);
 if(e2){await sb.from("ventas").delete().eq("id",v.id);return toast(e2.message)}
 S.cart={};S.sub={};S.pago="efectivo";S.clisel=null;await loadData();toast("Venta cobrada");render();
}
async function ingresar(){
 const g=id=>$(id).value;
 if(!g("ip")||!(+g("iq")>0))return toast("Elegí un producto y una cantidad");
 const {data:ing,error:e1}=await sb.from("ingresos").insert({ubicacion_id:S.loc,usuario_id:S.user.id}).select("id").single();
 if(e1)return toast(e1.message);
 const {error:e2}=await sb.from("ingreso_items").insert({ingreso_id:ing.id,producto_id:g("ip"),cantidad:+g("iq"),costo_unitario:+g("ic")||0,fecha_vencimiento:g("ie")||null,codigo_lote:g("il")||null});
 if(e2)return toast(e2.message);
 const {error:e3}=await sb.rpc("confirmar_ingreso",{p_ingreso:ing.id});
 if(e3)return toast(e3.message);
 await loadData();toast("Mercadería cargada");render();
}
async function importar(){
 const lines=$("tx").value.split("\n").map(x=>x.trim()).filter(Boolean),items=[],faltan=[];

  const p=nl&&(S.prods.find(x=>x.nombre.toLowerCase()==nl)||S.prods.find(x=>x.nombre.toLowerCase().includes(nl)));
  if(!p||!(+q>0)){faltan.push(n||l);continue}

let camStream=null,camTimer=null,camLast="",camAt=0;
async function openCam(mode){
 if(!("BarcodeDetector" in window))return toast("Este navegador no puede leer códigos con la cámara. Usá Chrome actualizado o el lápiz óptico.");
 try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})}
 catch(e){return toast("No pude abrir la cámara. Revisá el permiso del navegador.")}
 const box=document.createElement("div");box.id="cam";
 box.innerHTML='<video id="cv" playsinline muted></video><div class="camb"><span id="cm">Apuntá al código de barras</span><button class="btn" data-camx="1" style="margin:0">Listo</button></div>';
 document.body.appendChild(box);
 const v=$("cv");v.srcObject=camStream;await v.play();
 const want=["ean_13","ean_8","upc_a","upc_e","code_128","code_39"];
 let sup=[];try{sup=await BarcodeDetector.getSupportedFormats()}catch(e){}
 const f=want.filter(x=>sup.includes(x));
 const det=f.length?new BarcodeDetector({formats:f}):new BarcodeDetector();
 camTimer=setInterval(async()=>{
  try{
   const r=await det.detect(v);if(!r.length)return;
   const code=r[0].rawValue,now=Date.now();
   if(code==camLast&&now-camAt<2000)return;
   camLast=code;camAt=now;onCode(code,mode);
  }catch(e){}
 },300);
}
function closeCam(rerender){
 clearInterval(camTimer);
 if(camStream)camStream.getTracks().forEach(t=>t.stop());
 camStream=null;const b=$("cam");if(b)b.remove();
 if(rerender)render();
}
function onCode(code,mode){
 if(mode=="v"&&ventaBalanza(code))return;
 if(navigator.vibrate)navigator.vibrate(80);beep(S.prods.some(x=>x.codigo_barras==code)||mode!="v");
 const p=S.prods.find(x=>x.codigo_barras==code);
 if(mode=="v"){
  if(!p){$("cm").textContent="Código "+code+" no registrado";return}
  add(p.id);$("cm").textContent=p.nombre+" agregado ("+(S.cart[p.id]||0)+")";
 }else{
  closeCam(false);
  if(p){$("ip").value=p.id;$("iq").focus();toast("Producto elegido: "+p.nombre)}
  else{$("nb").value=code;$("nb").scrollIntoView({block:"center"});buscarCodigo(code)}
 }
}

async function fetchMes(det){

  const {data,error}=await sb.from("ventas").select(cols).eq("ubicacion_id",S.loc).gte("creada_en",ini).lt("creada_en",fin).order("creada_en").order("id").range(from,from+999);

const num=v=>{
 if(typeof v=="number")return v;
 let t=String(v==null?"":v).replace(/[^\d.,\-]/g,"");
 if(!t)return NaN;
 if(t.includes(".")&&t.includes(","))t=t.replace(/\./g,"").replace(",",".");
 else if(t.includes(","))t=t.replace(",",".");
 else if(/^-?\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,"");
 return parseFloat(t);
};
const fechaX=v=>{
 if(v===""||v==null)return null;
 if(typeof v=="number"){const d=new Date(Math.round((v-25569)*864e5));return isNaN(d)?null:d.toISOString().slice(0,10)}
 const t=String(v).trim();
 let m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
 if(m){const y=m[3].length==2?"20"+m[3]:m[3];return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")}
 m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);
 return m?m[0]:null;
};

async function leerExcel(f){
 if(!f)return;
 if(!window.XLSX)return toast("No se pudo cargar el lector de Excel. Revisá la conexión.");
 try{
  const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const all=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""}).filter(r=>r.some(c=>String(c).trim()!==""));
  if(all.length<2)return toast("El archivo no tiene filas para importar");
  const hdr=all[0].map(x=>String(x).trim());
  const norm=x=>x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const find=(re,ex)=>hdr.findIndex(h=>{const n=norm(h);return re.test(n)&&!(ex&&ex.test(n))});
  S.imp={hdr,rows:all.slice(1),map:{
   nombre:find(/nombre|producto|descripcion|articulo|detalle/),
   codigo:find(/codigo|ean|barra/),
   precio:find(/precio|venta|pvp/,/costo|compra/),
   costo:find(/costo|compra/),
   stock:find(/stock|cantidad|existencia|saldo/),
   venc:find(/venc|caduc/)}};
  render();
 }catch(e){toast("No pude leer ese archivo. Probá guardarlo como .xlsx o .csv")}
}
async function traerTodo(tabla,cols){
 let all=[],from=0;
 for(;;){
  const {data,error}=await sb.from(tabla).select(cols).range(from,from+999);
  if(error||!data)break;
  all=all.concat(data);
  if(data.length<1000)break;
  from+=1000;
 }
 return all;
}
async function importarExcel(){
 const m=S.imp,mp=m.map;
 if(!(mp.nombre>=0))return toast("Elegí la columna del nombre");
 const get=(r,k)=>mp[k]>=0?r[mp[k]]:"";
 const filas=[];
 m.rows.forEach(r=>{
  const nombre=String(get(r,"nombre")).trim();if(!nombre)return;
  const cod=String(get(r,"codigo")==null?"":get(r,"codigo")).trim().replace(/\.0+$/,"")||null;
  filas.push({nombre,cod,precio:num(get(r,"precio")),costo:num(get(r,"costo")),stock:num(get(r,"stock")),venc:fechaX(get(r,"venc"))});
 });
 if(!filas.length)return toast("No hay filas con nombre para importar");
 toast("Revisando los productos que ya tenés…");
 const ya=await traerTodo("productos","id,nombre,codigo_barras");
 const byCod={},byName={};
 ya.forEach(p=>{if(p.codigo_barras)byCod[p.codigo_barras]=p.id;byName[p.nombre.toLowerCase()]=p.id});
 const keyDe=f=>f.cod?"c"+f.cod:"n"+f.nombre.toLowerCase();
 const keys=new Map(),nuevos=[];let existentes=0;
 filas.forEach(f=>{
  const k=keyDe(f);if(keys.has(k))return;
  const ex=f.cod?byCod[f.cod]:byName[f.nombre.toLowerCase()];
  if(ex){keys.set(k,ex);existentes++;return}
  keys.set(k,null);
  nuevos.push({k,row:{nombre:f.nombre,codigo_barras:f.cod,precio_venta:Number.isFinite(f.precio)&&f.precio>=0?f.precio:0,costo:Number.isFinite(f.costo)&&f.costo>=0?f.costo:null}});
 });
 for(let i=0;i<nuevos.length;i+=200){
  const ch=nuevos.slice(i,i+200);
  const {data,error}=await sb.from("productos").insert(ch.map(x=>x.row)).select("id");
  if(error)return toast("Error al crear productos: "+error.message);
  data.forEach((d,j)=>keys.set(ch[j].k,d.id));
  toast("Productos creados: "+Math.min(i+200,nuevos.length)+" de "+nuevos.length);
 }
 const items=filas.filter(f=>f.stock>0).map(f=>({producto_id:keys.get(keyDe(f)),cantidad:f.stock,costo_unitario:Number.isFinite(f.costo)&&f.costo>=0?f.costo:0,fecha_vencimiento:f.venc,texto_ticket:"Importación"}));
 for(let i=0;i<items.length;i+=150){
  const {data:ing,error:e1}=await sb.from("ingresos").insert({ubicacion_id:S.loc,usuario_id:S.user.id,proveedor:"Importación"}).select("id").single();
  if(e1)return toast(e1.message);
  const {error:e2}=await sb.from("ingreso_items").insert(items.slice(i,i+150).map(x=>({...x,ingreso_id:ing.id})));
  if(e2)return toast(e2.message);
  const {error:e3}=await sb.rpc("confirmar_ingreso",{p_ingreso:ing.id});
  if(e3)return toast(e3.message);
  toast("Stock cargado: "+Math.min(i+150,items.length)+" de "+items.length);
 }
 S.imp=null;await loadData();
 toast("Listo: "+nuevos.length+" productos nuevos, "+existentes+" ya existían, "+items.length+" con stock cargado");
 render();
}
async function buscarCodigo(code){
 if(!code)return toast("Escribí o escaneá un código primero");
 try{
  const {data:cat}=await sb.from("catalogo_productos").select("nombre").eq("codigo_barras",code).maybeSingle();
  if(cat&&cat.nombre){if($("np")&&!$("np").value)$("np").value=cat.nombre;return toast("Encontrado en el catálogo compartido: "+cat.nombre)}
 }catch(e){}
 try{
  const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+"?fields=product_name,brands,quantity");
  const j=await r.json();
  if(j.status!==1||!j.product||!j.product.product_name)return toast("No encontré ese código en la base abierta. Cargalo a mano.");
  const p=j.product,nombre=[p.product_name,p.brands?"("+p.brands.split(",")[0].trim()+")":"",p.quantity||""].filter(Boolean).join(" ");
  if($("np")&&!$("np").value)$("np").value=nombre;
  toast("Encontrado: "+nombre+" (datos de Open Food Facts)");
 }catch(e){toast("No se pudo consultar la base de códigos. Revisá la conexión.")}
}
const balCfg=()=>Object.assign({pref:"2",val:5,modo:"peso"},(S.negocio&&S.negocio.balanza)||{});
function leerBalanza(code,c){
 c=c||balCfg();
 const pf=String(c.pref);
 if(!/^\d{13}$/.test(code)||!code.startsWith(pf))return null;
 const n=13-pf.length-c.val-1;
 if(n<1)return null;
 return {plu:code.slice(pf.length,pf.length+n).replace(/^0+/,"")||"0",valor:+code.slice(pf.length+n,pf.length+n+c.val)};
}
function ventaBalanza(code){
 const c=balCfg(),b=leerBalanza(code,c);
 if(!b)return false;
 const p=S.prods.find(x=>x.plu&&String(x.plu).replace(/^0+/,"")==b.plu);
 if(!p){beep(false);toast("Etiqueta de balanza: no hay un producto con código de balanza "+b.plu+". Cargalo en Ajustes.");return true}
 if(!esKg(p)){beep(false);toast("Marcá "+p.nombre+" como producto que se vende por kilo.");return true}
 let kg,m;
 if(c.modo=="peso"){kg=b.valor/1000;m=Math.round(kg*p.precio_venta*100)/100}
 else{m=c.modo=="precio_c"?b.valor/100:b.valor;kg=Math.round(m/p.precio_venta*1000)/1000}
 if(!(kg>0))return true;
 const ya=S.cart[p.id]||0,disp=Math.round((avail(p.id)-ya)*1000)/1000;
 if(kg>disp+1e-9){beep(false);toast("No hay tanto stock de "+p.nombre+". Disponible: "+fq(disp)+" kg");return true}
 S.cart[p.id]=Math.round((ya+kg)*1000)/1000;
 S.sub[p.id]=Math.round(((S.sub[p.id]||0)+m)*100)/100;
 beep(true);if(navigator.vibrate)navigator.vibrate(80);
 const cm=$("cm");if(cm)cm.textContent=p.nombre+": "+fq(kg)+" kg · "+money(m);
 return true;
}
function balanzaHTML(d){
 const c=balCfg();
 return `<h2>Etiquetas de balanza</h2><div class="card"><label>Prefijo de la etiqueta<input id="bp" value="${esc(c.pref)}" inputmode="numeric"${d}></label><label>Dígitos del peso o precio<select id="bv"${d}>${[4,5,6].map(n=>`<option value="${n}"${c.val==n?" selected":""}>${n}</option>`).join("")}</select></label><label>La etiqueta trae<select id="bm"${d}><option value="peso"${c.modo=="peso"?" selected":""}>Peso en gramos</option><option value="precio_p"${c.modo=="precio_p"?" selected":""}>Precio en pesos</option><option value="precio_c"${c.modo=="precio_c"?" selected":""}>Precio en centavos</option></select></label>${d?"":'<button class="btn" data-balsave="1">Guardar</button>'}<label>Probar con un código<input id="bt" inputmode="numeric" placeholder="Pegá o escaneá una etiqueta"></label><p id="bo" class="note"></p><p class="note">El código de balanza de cada producto se carga abajo, en Límites por producto.</p></div>`;
}
async function guardarBalanza(){
 const pref=$("bp").value.trim().replace(/\D/g,"");
 if(!pref||pref.length>2)return toast("El prefijo tiene 1 o 2 dígitos");
 const {error}=await sb.from("negocios").update({balanza:{pref,val:+$("bv").value,modo:$("bm").value}}).eq("id",S.perfil.negocio_id);
 if(error)return toast(error.message);
 const {data}=await sb.from("negocios").select("*").maybeSingle();S.negocio=data;
 toast("Formato de balanza guardado");render();
}
const redondeoN=()=>Number((S.negocio&&S.negocio.redondeo)||1);
const precioDe=(costo,mg)=>{
 if(!(costo>=0)||!(mg>0)||mg>=100)return NaN;
 const r=redondeoN();
 return Math.round(Math.round(costo/(1-mg/100)/r)*r*100)/100;
};
const MG=[[30,"30% (costo ÷ 0,7)"],[40,"40% (costo ÷ 0,6)"],[50,"50% (costo ÷ 0,5)"]];
const mgOpts=sel=>MG.map(m=>`<option value="${m[0]}"${sel==m[0]?" selected":""}>Ganancia ${m[1]}</option>`).join("")+`<option value="otro"${sel=="otro"?" selected":""}>Otro porcentaje</option><option value="man"${sel=="man"?" selected":""}>Precio a mano</option>`;
const mgDe=(v,otro)=>v=="man"?null:v=="otro"?(+otro>0?+otro:null):+v;
const defModo=()=>{const m=Number((S.negocio&&S.negocio.margen_defecto)||30);return [30,40,50].includes(m)?String(m):"otro"};
function calcNuevo(){
 const mg=mgDe($("nm").value,$("nmo").value);if(mg==null)return;
 const pr=precioDe(+$("nco").value,mg);
 if(Number.isFinite(pr))$("npr").value=pr;
}
function calcFila(id){
 const q=a=>document.querySelector("["+a+'="'+id+'"]');
 const mg=mgDe(q("data-pm").value,q("data-pmo").value);if(mg==null)return;
 const pr=precioDe(+q("data-pc").value,mg);
 if(Number.isFinite(pr))q("data-pp").value=pr;
}
async function guardarPrecio(id){
 const q=a=>document.querySelector("["+a+'="'+id+'"]');
 const mg=mgDe(q("data-pm").value,q("data-pmo").value),costo=q("data-pc").value===""?null:+q("data-pc").value,precio=+q("data-pp").value;
 if(!(precio>=0))return toast("Poné un precio válido");
 const {error}=await sb.from("productos").update({costo,precio_venta:precio,margen:mg}).eq("id",id);
 if(error)return toast(error.message);
 await loadData();toast("Precio guardado");render();
}
async function guardarPreciosCfg(){
 const mg=+$("gmd").value;
 if(!(mg>0&&mg<100))return toast("La ganancia tiene que estar entre 1 y 99");
 const {error}=await sb.from("negocios").update({margen_defecto:mg,redondeo:+$("gre").value}).eq("id",S.perfil.negocio_id);
 if(error)return toast(error.message);
 const {data}=await sb.from("negocios").select("*").maybeSingle();S.negocio=data;
 toast("Guardado");render();
}
function preciosHTML(d){
 if(d)return "";
 const c=S.negocio||{},q=(S.pq||"").toLowerCase();
 const lista=S.prods.filter(p=>!q||p.nombre.toLowerCase().includes(q)).slice(0,25).map(p=>{
  const md=p.margen==null?"man":[30,40,50].includes(+p.margen)?String(+p.margen):"otro";
  return `<div class="card"><b>${esc(p.nombre)}</b><div class="tr"><label>Costo<input data-pc="${p.id}" type="number" min="0" step="any" value="${p.costo==null?"":p.costo}"></label><label>Precio<input data-pp="${p.id}" type="number" min="0" step="any" value="${p.precio_venta}"></label></div><select data-pm="${p.id}">${mgOpts(md)}</select><input data-pmo="${p.id}" type="number" step="any" placeholder="Porcentaje de ganancia" value="${md=="otro"?p.margen:""}" style="${md=="otro"?"":"display:none"}"><button class="btn" data-psave="${p.id}">Guardar precio</button></div>`;
 }).join("");
 return `<h2>Precios y ganancia</h2><div class="card"><label>Ganancia por defecto (%)<input id="gmd" type="number" min="1" max="99" step="any" value="${c.margen_defecto==null?30:c.margen_defecto}"></label><label>Redondear precios a<select id="gre">${[1,10,50,100].map(n=>`<option value="${n}"${Number(c.redondeo||1)==n?" selected":""}>$${n}</option>`).join("")}</select></label><button class="btn" data-psetsave="1">Guardar</button><p class="note">Precio = costo ÷ (1 − ganancia). Con 30% es costo ÷ 0,7. El porcentaje es sobre el precio de venta. Si un producto tiene ganancia elegida y cambia su costo, el precio se actualiza solo.</p></div><div class="card"><input id="psq" placeholder="Buscar producto para editar su precio" value="${esc(S.pq||"")}"></div>${lista}`;
}
async function newProd(){
 const g=id=>$(id).value.trim();
 if(!g("np")||!(+g("npr")>=0)||g("npr")==="")return toast("Falta el nombre o el precio");
 const {error}=await sb.from("productos").insert({nombre:g("np"),codigo_barras:g("nb")||null,precio_venta:+g("npr"),unidad:$("nu").value,margen:mgDe($("nm").value,$("nmo").value),costo:g("nco")===""?null:+g("nco")});
 if(error)return toast(error.message);
 await loadData();toast("Producto creado");render();
}

document.addEventListener("click",async e=>{
 const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(d.login){const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)return renderLogin("No se pudo entrar. Revisá el email y la contraseña.");return boot()}
 if(d.tab){S.tab=d.tab;return render()}
 if(d.add){add(d.add);return $("vl")?($("vl").innerHTML=listHTML()):render()}
 if(d.dec){if(S.cart[d.dec]>1)S.cart[d.dec]--;else delete S.cart[d.dec];return $("vl").innerHTML=listHTML()}
 if(d.pay)return pay();
 if(d.ing)return ingresar();
 if(d.newp)return newProd();
 if(d.cam)return openCam(d.cam);
 if(d.open)return abrirCaja();
 if(d.xls)return exportar();
 if(d.negsave)return guardarNegocio();
 if(d.uadd)return crearUsuario();
 if(d.udel){if(confirm("¿Quitar el acceso a este usuario?"))accesoUsuario(d.udel,false);return}
 if(d.uon)return accesoUsuario(d.uon,true);
 if(d.pdes)return activoProd(d.pdes,false);
 if(d.pact)return activoProd(d.pact,true);
 if(d.baja)return darBaja(d.baja,d.q);
 if(d.psave)return guardarPrecio(d.psave);
 if(d.psetsave)return guardarPreciosCfg();
 if(d.balsave)return guardarBalanza();
 if(d.impgo)return importarExcel();
 if(d.lookup)return buscarCodigo($("nb").value.trim());
 if(d.cnew)return nuevoCliente();
 if(d.cpay)return pagoCliente(d.cpay);
 if(d.wadd)return pesoAgregar();
 if(d.wcan){S.pesar=null;return $("vl").innerHTML=listHTML()}
 if(d.wdel){delete S.cart[d.wdel];delete S.sub[d.wdel];return $("vl").innerHTML=listHTML()}
 if(d.closecaja)return cerrarCaja();
 if(d.okres){S.res=null;return render()}
 if(d.camx)return closeCam(S.tab=="v");
 if(d.imp)return importar();
 if(d.close){const {data,error}=await sb.rpc("cerrar_dia",{p_ubicacion:S.loc});return error?toast(error.message):toast("Día cerrado. Vendido "+money(data.vendido)+" · Invertido "+money(data.invertido)+" · Ganancia "+money(data.ganancia))}
 if(d.save){const {error}=await sb.from("configuracion_alertas").update({stock_minimo_general:+$("gm").value||0,dias_alerta_vencimiento:+$("gd").value||0}).eq("negocio_id",S.perfil.negocio_id);if(error)return toast(error.message);await loadData();return toast("Límites guardados")}
 if(d.out){await sb.auth.signOut();S.cart={};return renderLogin()}
});
document.addEventListener("change",async e=>{
 if(e.target.id=="nm"){$("nmo").style.display=e.target.value=="otro"?"block":"none";calcNuevo();return}
 if(e.target.dataset.pm){const id=e.target.dataset.pm;document.querySelector('[data-pmo="'+id+'"]').style.display=e.target.value=="otro"?"block":"none";calcFila(id);return}
 if(e.target.id=="psq"){S.pq=e.target.value;return render()}
 if(e.target.id=="xf"){leerExcel(e.target.files[0]);return}
 if(e.target.dataset.imap){S.imp.map[e.target.dataset.imap]=+e.target.value;return render()}
 if(e.target.dataset.urol){const {error}=await sb.from("perfiles").update({rol:e.target.value}).eq("id",e.target.dataset.urol);return toast(error?error.message:"Rol actualizado")}
 if(e.target.id=="mes"){S.mes=e.target.value||S.mes;return render()}
 if(e.target.id=="mp"){S.pago=e.target.value;$("vl").innerHTML=listHTML();return}
 if(e.target.id=="mc"){S.clisel=e.target.value;return}
 if(e.target.dataset.pl){const v=e.target.dataset.f=="unidad"?e.target.value:e.target.dataset.f=="plu"?(e.target.value.trim()||null):(e.target.value===""?null:Math.max(0,+e.target.value));const {error}=await sb.from("productos").update({[e.target.dataset.f]:v}).eq("id",e.target.dataset.pl);if(error)return toast(error.message);await loadData();return toast("Límite guardado")}
 if(e.target.id=="loc"){S.loc=e.target.value;S.cart={};S.sub={};S.pesar=null;await loadData();render()}
});
document.addEventListener("input",e=>{
 if(e.target.id=="q"){S.q=e.target.value;$("vl").innerHTML=listHTML();return}
 if(e.target.id=="nco"||e.target.id=="nmo"){calcNuevo();return}
 if(e.target.id=="npr"){$("nm").value="man";$("nmo").style.display="none";return}
 const pid=e.target.dataset.pc||e.target.dataset.pmo;
 if(pid){calcFila(pid);return}
 if(e.target.dataset.pp){const id=e.target.dataset.pp;document.querySelector('[data-pm="'+id+'"]').value="man";document.querySelector('[data-pmo="'+id+'"]').style.display="none";return}
 if(e.target.id=="bt"){
  const c={pref:$("bp").value.trim()||"2",val:+$("bv").value,modo:$("bm").value},b=leerBalanza(e.target.value.trim(),c);
  $("bo").textContent=b?"Código de balanza "+b.plu+" · valor "+b.valor+(c.modo=="peso"?" g":c.modo=="precio_c"?" centavos":" pesos"):"No coincide con el formato";return;
 }
 if(e.target.id=="wp"||e.target.id=="wu"){
  const p=S.prods.find(x=>x.id==S.pesar);if(!p)return;
  const kg=(+$("wp").value||0)/($("wu").value=="g"?1000:1);
  $("wm").value=kg?Math.round(kg*p.precio_venta*100)/100:"";return;
 }
 if(e.target.id=="wm"){
  const p=S.prods.find(x=>x.id==S.pesar);if(!p)return;
  const kg=(+$("wm").value||0)/p.precio_venta;
  $("wp").value=kg?Math.round(($("wu").value=="g"?kg*1000:kg)*1000)/1000:"";return;
 }
});
let buf="";
document.addEventListener("keydown",e=>{
 if(e.target.id=="q"){if(e.key=="Enter")scan(S.q);return}
 if(e.target.tagName=="INPUT"||e.target.tagName=="SELECT"||S.tab!="v"||!S.user)return;
 if(e.key=="Enter"){if(buf.length>3){e.preventDefault();scan(buf)}buf="";return}
 if(e.key.length==1){buf+=e.key;clearTimeout(scan.t);scan.t=setTimeout(()=>buf="",150)}
});
boot();
</script>
